<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Crown & Blade — Admin</title>
<style>
:root{--bg:#080706;--panel:#11100f;--line:#ffffff14;--gold:#e3b477;--text:#f5eee5;--muted:#91877d;--danger:#b86d62}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}body{padding:28px}
button,input{font:inherit}.admin-shell{max-width:1380px;margin:0 auto}.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.24em}.admin-head h1{margin:7px 0 0;font:500 42px/1 Georgia,serif}.admin-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.logout{border:1px solid #c89d6566;background:#11100f;color:var(--gold);padding:11px 16px;border-radius:999px;cursor:pointer}
.login{max-width:420px;margin:12vh auto 0;padding:28px;border:1px solid #c89d6555;border-radius:20px;background:linear-gradient(180deg,#151311,#0d0c0b);box-shadow:0 30px 80px #0009}.login h1{font:500 32px Georgia,serif;margin:8px 0}.login p{color:var(--muted);font-size:12px;line-height:1.6}.login input{width:100%;height:48px;margin:10px 0;padding:0 14px;border:1px solid #ffffff18;border-radius:10px;background:#0b0a09;color:var(--text);outline:none}.login button{width:100%;height:48px;border:1px solid #f0c98d;border-radius:999px;background:linear-gradient(180deg,#f0c98d,#dca866);color:#17110b;cursor:pointer}.error{min-height:20px;margin-top:10px;color:#d99b91;font-size:11px}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;margin-top:8px;font-size:26px;font-weight:500;color:var(--gold)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #ffffff14;background:#11100f;color:#9c9289;border-radius:999px;padding:10px 14px;font-size:11px;cursor:pointer}.tab.active{border-color:#c89d6577;color:var(--gold);background:#c89d6512}.panel{border:1px solid var(--line);border-radius:16px;background:#0d0c0b;overflow:hidden}.toolbar{display:flex;justify-content:space-between;gap:10px;padding:15px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.refresh{border:1px solid #c89d6555;background:#11100f;color:var(--gold);border-radius:999px;padding:8px 12px;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:top}th{color:var(--gold);font-size:9px;letter-spacing:.08em;text-transform:uppercase}td{color:#d8d0c8}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#c89d6514;color:var(--gold);font-size:9px}.cancel{border:1px solid #b86d6266;background:#b86d6210;color:#d99b91;border-radius:999px;padding:7px 10px;font-size:9px;cursor:pointer}.empty{padding:35px;color:var(--muted);text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}.card{padding:16px;border:1px solid var(--line);border-radius:13px;background:#11100f}.card strong{display:block;color:var(--text);font-size:13px}.card span{display:block;margin-top:7px;color:var(--muted);font-size:10px}.status{padding:10px 15px;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
@media(max-width:900px){body{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.admin-head{align-items:flex-start}.grid{grid-template-columns:1fr}.admin-head h1{font-size:32px}}
</style>
</head>
<body>
<div id="login" class="login">
  <span class="eyebrow">CROWN &amp; BLADE</span><h1>Admin panel</h1>
  <p>Внутрішня сторінка адміністратора. Вона не підключена до публічного меню сайту.</p>
  <input id="password" type="password" placeholder="Пароль адміністратора" autocomplete="current-password">
  <button id="loginBtn" type="button">УВІЙТИ →</button>
  <div id="loginError" class="error"></div>
</div>
<div id="app" class="admin-shell hidden">
  <header class="admin-head"><div><span class="eyebrow">CROWN &amp; BLADE · INTERNAL</span><h1>Адмін-панель</h1><p>Бронювання, клієнти, барбери, графік, послуги та статистика.</p></div><button id="logout" class="logout">ВИЙТИ</button></header>
  <section class="stats" id="stats"></section>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="bookings">Бронювання</button><button class="tab" data-tab="clients">Клієнти</button><button class="tab" data-tab="barbers">Барбери</button><button class="tab" data-tab="schedule">Графік</button><button class="tab" data-tab="services">Послуги / ціни</button><button class="tab" data-tab="cancelled">Скасування</button><button class="tab" data-tab="stats">Статистика</button>
  </nav>
  <section class="panel"><div class="toolbar"><span id="panelTitle">Бронювання</span><button class="refresh" id="refresh">ОНОВИТИ</button></div><div id="content"></div><div class="status" id="status"></div></section>
</div>
<script>
const state={password:sessionStorage.getItem('cb_admin_password')||'',data:null,tab:'bookings'};
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function api(url,options={}){return fetch(url,{...options,headers:{...(options.headers||{}),'x-admin-password':state.password,'Accept':'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Помилка');return d});}
function renderStats(){const s=state.data?.stats||{};$('#stats').innerHTML=[['Бронювань',s.totalBookings||0],['Активні',s.activeBookings||0],['Скасовані',s.cancelledBookings||0],['Клієнти',s.clients||0],['Сьогодні',s.todayBookings||0]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');}
function bookingRows(cancelledOnly=false){const rows=(state.data?.bookings||[]).filter(b=>cancelledOnly?String(b.status||'').toLowerCase()==='cancelled':String(b.status||'').toLowerCase()!=='cancelled');if(!rows.length)return '<div class="empty">Записів поки немає.</div>';return `<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Час</th><th>Послуга</th><th>Барбер</th><th>Email</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.time)}</td><td>${esc(b.service||b.service_key)}</td><td>${esc(b.barber)}</td><td>${esc(b.customer_email||'—')}</td><td><span class="badge">${esc(b.status||'confirmed')}</span></td><td>${cancelledOnly?'':`<button class="cancel" data-cancel="${esc(b.id)}">СКАСУВАТИ</button>`}</td></tr>`).join('')}</tbody></table></div>`;}
function clients(){const rows=state.data?.clients||[];if(!rows.length)return '<div class="empty">Клієнтів у базі поки немає.</div>';return `<div class="table-wrap"><table><thead><tr><th>Імʼя</th><th>Email</th><th>Телефон</th><th>ID</th><th>Створено</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td class="muted">${esc(c.id)}</td><td>${esc(c.created_at||'—')}</td></tr>`).join('')}</tbody></table></div>`;}
function cards(items,label){return `<div class="grid">${items.map(x=>`<div class="card"><strong>${esc(x.name||x)}</strong><span>${esc(x.price||label||'')}</span></div>`).join('')}</div>`;}
function schedule(){const times=state.data?.times||[];return `<div class="grid">${(state.data?.barbers||[]).map(b=>`<div class="card"><strong>${esc(b)}</strong><span>${times.join(' · ')}</span></div>`).join('')}</div>`;}
function stats(){const bookings=state.data?.bookings||[];const active=bookings.filter(b=>String(b.status||'').toLowerCase()!=='cancelled');const counts={};active.forEach(b=>counts[b.service||b.service_key]=(counts[b.service||b.service_key]||0)+1);return `<div class="grid">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="card"><strong>${esc(k)}</strong><span>${v} бронювань</span></div>`).join('')||'<div class="empty">Немає даних для статистики.</div>'}</div>`;}
function render(){const titles={bookings:'Бронювання',clients:'Клієнти',barbers:'Барбери',schedule:'Графік',services:'Послуги / ціни',cancelled:'Скасування',stats:'Статистика'};$('#panelTitle').textContent=titles[state.tab];document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let html='';if(state.tab==='bookings')html=bookingRows(false);if(state.tab==='clients')html=clients();if(state.tab==='barbers')html=cards(state.data?.barbers||[],'BARBER');if(state.tab==='schedule')html=schedule();if(state.tab==='services')html=cards(state.data?.services||[]);if(state.tab==='cancelled')html=bookingRows(true);if(state.tab==='stats')html=stats();$('#content').innerHTML=html;}
async function load(){if(!state.password)return;$('#status').textContent='Завантаження…';try{state.data=await api('./api/admin');sessionStorage.setItem('cb_admin_password',state.password);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderStats();render();$('#status').textContent='База даних синхронізована.';}catch(e){$('#status').textContent=e.message;$('#loginError').textContent=e.message;sessionStorage.removeItem('cb_admin_password');$('#login').classList.remove('hidden');$('#app').classList.add('hidden');}}
$('#loginBtn').onclick=()=>{state.password=$('#password').value.trim();$('#loginError').textContent='';load()};$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});$('#logout').onclick=()=>{sessionStorage.removeItem('cb_admin_password');location.reload()};$('#refresh').onclick=load;$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;state.tab=b.dataset.tab;render()});$('#content').addEventListener('click',async e=>{const b=e.target.closest('[data-cancel]');if(!b)return;if(!confirm('Скасувати це бронювання?'))return;try{await api('./api/admin?id='+encodeURIComponent(b.dataset.cancel),{method:'DELETE'});await load();state.tab='cancelled';render();}catch(err){$('#status').textContent=err.message;}});
load();
</script>
</body>
</html>
