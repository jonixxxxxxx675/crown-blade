<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Наші відділення</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile-overrides.css">
<style>
  .mobile-branches{padding-bottom:40px}
  .branches-header{margin-bottom:28px}
  .branches-header h1{max-width:330px}
  .branches-list{display:grid;gap:14px}
  .branch-card{padding:24px 20px;border:1px solid #ffffff12;border-radius:22px;background:linear-gradient(180deg,#121110,#0d0c0b);box-shadow:0 16px 40px #0007,inset 0 1px 0 #ffffff08}
  .branch-number{display:block;margin-bottom:8px;color:#d8a96d;font:600 9px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase}
  .branch-card h2{margin:0 0 10px;color:#f5eee5;font:500 31px/1.05 "Cormorant Garamond",serif}
  .branch-address{margin:0;color:#a69d95;font:12px/1.5 Inter,sans-serif}
  .branch-map{display:inline-block;margin-top:16px;color:#d8a96d;font:600 9px/1 Inter,sans-serif;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
</style>
</head>
<body>
<main class="mobile-page mobile-branches">
<a class="mobile-page-back compact-back" href="./index.html">← <span data-i18n="back">Назад</span></a>
<section class="branches-header">
  <span class="eyebrow">ВІДДІЛЕННЯ</span>
  <h1>Наші<br>відділення</h1>
</section>
<section class="branches-list" aria-label="Наші відділення">
  <article class="branch-card">
    <span class="branch-number">ВІДДІЛЕННЯ 01</span>
    <h2>Центральне<br>відділення</h2>
    <p class="branch-address">вул. Князя Романа, 24, Львів</p>
    <a class="branch-map" href="https://www.google.com/maps/search/?api=1&query=вул.+Князя+Романа,+24,+Львів" target="_blank" rel="noopener noreferrer">ВІДКРИТИ НА КАРТІ →</a>
  </article>
  <article class="branch-card">
    <span class="branch-number">ВІДДІЛЕННЯ 02</span>
    <h2>Південне<br>відділення</h2>
    <p class="branch-address">вул. Івана Франка, 33, Львів</p>
    <a class="branch-map" href="https://www.google.com/maps/search/?api=1&query=вул.+Івана+Франка,+33,+Львів" target="_blank" rel="noopener noreferrer">ВІДКРИТИ НА КАРТІ →</a>
  </article>
  <article class="branch-card">
    <span class="branch-number">ВІДДІЛЕННЯ 03</span>
    <h2>Forum Lviv</h2>
    <p class="branch-address">вул. Під Дубом, 7Б, Львів</p>
    <a class="branch-map" href="https://www.google.com/maps/search/?api=1&query=Forum+Lviv,+вул.+Під+Дубом,+7Б,+Львів" target="_blank" rel="noopener noreferrer">ВІДКРИТИ НА КАРТІ →</a>
  </article>
</section>
</main>
<script src="./mobile-i18n.js"></script>
</body>
</html>
