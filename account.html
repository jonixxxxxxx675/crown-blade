<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Account</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile-overrides.css">
</head>
<body>
<main class="mobile-page mobile-account">
<a class="mobile-page-back" href="./index.html">← <span data-i18n="back">Назад</span></a>
<section id="account-register">
<span class="eyebrow" data-i18n="accountEyebrow">АКАУНТ</span>
<h1><span data-i18n="accountTitle">Створити акаунт</span></h1>
<p><span data-i18n="accountText">Зареєструйте акаунт, щоб зберігати свої записи та швидше бронювати наступний візит.</span></p>
<form class="mobile-form" id="register-form">
<input type="text" name="name" placeholder="Ім’я" data-i18n-placeholder="namePlaceholder" autocomplete="name" required>
<input type="email" name="email" placeholder="Email" data-i18n-placeholder="accountEmailPlaceholder" autocomplete="email" required>
<input type="password" name="password" placeholder="Пароль" data-i18n-placeholder="passwordPlaceholder" autocomplete="new-password" minlength="6" required>
<button type="submit"><span data-i18n="register">ЗАРЕЄСТРУВАТИСЯ →</span></button>
<div class="account-status" id="register-status" aria-live="polite"></div>
</form>
</section>

<section id="account-dashboard" hidden>
<span class="eyebrow" data-i18n="accountEyebrow">АКАУНТ</span>
<h1 data-i18n="accountWelcome">Мій акаунт</h1>
<div class="account-card">
  <h2 id="account-name">—</h2>
  <div class="account-muted" id="account-email">—</div>
</div>
<div class="account-card">
  <h2 data-i18n="accountBookings">Мої бронювання</h2>
  <div id="account-bookings"></div>
</div>
<button class="mobile-page page-action" id="logout" type="button" data-i18n="accountLogout">ВИЙТИ</button>
<div class="account-status" id="account-status" aria-live="polite"></div>
</section>
</main>
<script src="./mobile-i18n.js"></script>
<script>
(function(){
  const ACCOUNT_KEY='crown_blade_account';
  const BOOKINGS_KEY='crown_blade_mobile_bookings';
  const accountRegister=document.querySelector('#account-register');
  const accountDashboard=document.querySelector('#account-dashboard');
  const form=document.querySelector('#register-form');
  const status=document.querySelector('#register-status');
  const dashStatus=document.querySelector('#account-status');
  const getAccount=()=>{try{return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'null')}catch{return null}};
  const getBookings=()=>{try{return JSON.parse(localStorage.getItem(BOOKINGS_KEY)||'[]')}catch{return []}};
  const saveBookings=v=>localStorage.setItem(BOOKINGS_KEY,JSON.stringify(v));
  const account=getAccount();
  function formatBooking(b){
    const serviceName=b.service||b.serviceKey||'';
    return '<div class="account-booking" data-id="'+String(b.id).replace(/[^a-zA-Z0-9_-]/g,'')+'">'
      +'<strong>'+serviceName+'</strong>'
      +'<div class="account-booking-meta">'+b.barber+' · '+b.date+' · '+b.time+'</div>'
      +'<div class="account-booking-status">'+t('accountConfirmed')+'</div>'
      +'<div class="account-booking-actions"><button class="primary" data-edit="'+b.id+'" type="button">'+t('accountEdit')+'</button><button data-cancel="'+b.id+'" type="button">'+t('accountCancel')+'</button></div>'
      +'</div>';
  }
  function renderDashboard(){
    const a=getAccount();
    if(!a){accountRegister.hidden=false;accountDashboard.hidden=true;return}
    accountRegister.hidden=true;accountDashboard.hidden=false;
    document.querySelector('#account-name').textContent=a.name;
    document.querySelector('#account-email').textContent=a.email;
    const all=getBookings();
    const bookings=all.filter(b=>!b.accountId || b.accountId===a.id);
    const box=document.querySelector('#account-bookings');
    box.innerHTML=bookings.length?bookings.map(formatBooking).join(''):'<div class="account-empty">'+t('accountNoBookings')+'</div>';
    box.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>{
      const booking=all.find(b=>b.id===btn.dataset.edit); if(!booking)return;
      localStorage.setItem('cb-edit-booking',JSON.stringify(booking));
      window.location.href='./index.html#booking';
    });
    box.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=async()=>{
      const id=btn.dataset.cancel;
      if(!confirm(currentLang==='en'?'Cancel this booking?':'Скасувати це бронювання?'))return;
      const target=all.find(b=>b.id===id);
      const next=all.filter(b=>b.id!==id); saveBookings(next);
      try{await fetch('./api/bookings?id='+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
      dashStatus.textContent=t('accountCancelled');
      renderDashboard();
    });
  }
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const newAccount={id:'CBU-'+Date.now().toString(36).toUpperCase(),name:String(fd.get('name')).trim(),email:String(fd.get('email')).trim().toLowerCase(),createdAt:new Date().toISOString()};
    localStorage.setItem(ACCOUNT_KEY,JSON.stringify(newAccount));
    status.textContent=t('accountRegistered');
    renderDashboard();
  });
  document.querySelector('#logout').onclick=()=>{localStorage.removeItem(ACCOUNT_KEY);renderDashboard()};
  window.addEventListener('languagechange',renderDashboard);
  renderDashboard();
})();
</script>
</body>
</html>
