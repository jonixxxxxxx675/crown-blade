<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Account</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile-overrides.css">
</head>
<body>
<main class="mobile-page mobile-account">
<a class="mobile-page-back compact-back" href="./index.html">← <span data-i18n="back">Назад</span></a>

<section id="account-register">
<span class="eyebrow" data-i18n="accountEyebrow">АКАУНТ</span>
<h1><span data-i18n="accountTitle">Створити акаунт</span></h1>
<p><span data-i18n="accountText">Зареєструйте акаунт, щоб зберігати свої записи та швидше бронювати наступний візит.</span></p>
<form class="mobile-form" id="register-form">
<input type="text" name="name" placeholder="Ім’я" data-i18n-placeholder="namePlaceholder" autocomplete="name" required>
<input type="email" name="email" placeholder="Email" data-i18n-placeholder="accountEmailPlaceholder" autocomplete="email" required>
<input type="tel" name="phone" placeholder="Номер телефону" data-i18n-placeholder="phonePlaceholder" autocomplete="tel" inputmode="tel" pattern="[+0-9 ()-]{9,20}" required>
<div class="password-field">
  <input id="account-password" type="password" name="password" placeholder="Пароль" data-i18n-placeholder="passwordPlaceholder" autocomplete="new-password" minlength="6" required>
  <button class="password-toggle" id="password-toggle" type="button" aria-label="Показати пароль" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.3-5 9.8-5 9.8 5 9.8 5-3.3 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.6"/></svg>
  </button>
</div>
<button class="account-primary-action" type="submit"><span data-i18n="register">ЗАРЕЄСТРУВАТИСЯ →</span></button>
<div class="account-secondary-actions">
  <button id="show-login" type="button" data-i18n="accountLogin">УВІЙТИ</button>
  <button id="forgot-password" type="button" data-i18n="accountForgot">Забули пароль?</button>
</div>
<div class="account-status" id="register-status" aria-live="polite"></div>
</form>
</section>

<section id="account-login" hidden>
<span class="eyebrow" data-i18n="accountEyebrow">АКАУНТ</span>
<h1 data-i18n="accountLoginTitle">Увійти</h1>
<p data-i18n="accountLoginText">Увійдіть, щоб переглядати свої бронювання.</p>
<form class="mobile-form" id="login-form">
<input type="email" name="email" placeholder="Email" data-i18n-placeholder="accountEmailPlaceholder" autocomplete="email" required>
<div class="password-field">
  <input id="login-password" type="password" name="password" placeholder="Пароль" data-i18n-placeholder="passwordPlaceholder" autocomplete="current-password" required>
  <button class="password-toggle" id="login-password-toggle" type="button" aria-label="Показати пароль" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.3-5 9.8-5 9.8 5 9.8 5-3.3 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.6"/></svg>
  </button>
</div>
<button class="account-primary-action" type="submit"><span data-i18n="accountLogin">УВІЙТИ</span> →</button>
<div class="account-secondary-actions"><button id="show-register" type="button" data-i18n="accountCreate">СТВОРИТИ АКАУНТ</button></div>
<div class="account-status" id="login-status" aria-live="polite"></div>
</form>
</section>

<section id="account-dashboard" hidden>
<span class="eyebrow" data-i18n="accountEyebrow">АКАУНТ</span>
<h1 data-i18n="accountWelcome">Мій акаунт</h1>
<div class="account-card">
  <h2 id="account-name">—</h2>
  <div class="account-muted" id="account-email">—</div>
  <div class="account-muted" id="account-phone">—</div>
  <div class="account-verification" id="account-verification" aria-live="polite"></div>
</div>
<div class="account-card">
  <h2 data-i18n="accountBookings">Мої бронювання</h2>
  <div id="account-bookings"></div>
</div>
<button class="page-action compact-logout" id="logout" type="button" data-i18n="accountLogout">ВИЙТИ</button>
<div class="account-status" id="account-status" aria-live="polite"></div>
</section>
</main>
<script src="./mobile-i18n.js"></script>
<script>
(function(){
  const ACCOUNT_KEY='crown_blade_account';
  const PROFILE_KEY='crown_blade_account_profile';
  const BOOKINGS_KEY='crown_blade_mobile_bookings';
  const accountRegister=document.querySelector('#account-register');
  const accountLogin=document.querySelector('#account-login');
  const accountDashboard=document.querySelector('#account-dashboard');
  const registerForm=document.querySelector('#register-form');
  const loginForm=document.querySelector('#login-form');
  const registerStatus=document.querySelector('#register-status');
  const loginStatus=document.querySelector('#login-status');
  const dashStatus=document.querySelector('#account-status');
  const verification=document.querySelector('#account-verification');

  const getJSON=(key,fallback=null)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}};
  const getSession=()=>getJSON(ACCOUNT_KEY,null);
  const getProfile=()=>getJSON(PROFILE_KEY,null);
  const saveSession=a=>localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));
  const saveProfile=a=>localStorage.setItem(PROFILE_KEY,JSON.stringify(a));
  const getBookings=()=>getJSON(BOOKINGS_KEY,[]);
  const saveBookings=v=>localStorage.setItem(BOOKINGS_KEY,JSON.stringify(v));

  async function hashPassword(value){
    if(window.crypto?.subtle){
      const data=new TextEncoder().encode(value);
      const digest=await crypto.subtle.digest('SHA-256',data);
      return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    let hash=0;for(let i=0;i<value.length;i++)hash=((hash<<5)-hash)+value.charCodeAt(i)|0;return String(hash);
  }

  function bindPasswordToggle(button,input){
    button?.addEventListener('click',()=>{
      const visible=input.type==='text';
      input.type=visible?'password':'text';
      button.setAttribute('aria-pressed',visible?'false':'true');
      button.setAttribute('aria-label',visible?t('accountShowPassword'):t('accountHidePassword'));
    });
  }
  bindPasswordToggle(document.querySelector('#password-toggle'),document.querySelector('#account-password'));
  bindPasswordToggle(document.querySelector('#login-password-toggle'),document.querySelector('#login-password'));

  function showView(view){
    accountRegister.hidden=view!=='register';
    accountLogin.hidden=view!=='login';
    accountDashboard.hidden=view!=='dashboard';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function formatBooking(b){
    const serviceName=b.service||b.serviceKey||'';
    return '<div class="account-booking" data-id="'+String(b.id).replace(/[^a-zA-Z0-9_-]/g,'')+'">'
      +'<strong>'+serviceName+'</strong>'
      +'<div class="account-booking-meta">'+b.barber+' · '+b.date+' · '+b.time+'</div>'
      +'<div class="account-booking-status">'+t('accountConfirmed')+'</div>'
      +'<div class="account-booking-actions"><button class="primary" data-edit="'+b.id+'" type="button">'+t('accountEdit')+'</button><button data-cancel="'+b.id+'" type="button">'+t('accountCancel')+'</button></div>'
      +'</div>';
  }

  function renderDashboard(){
    const a=getSession();
    if(!a){showView(getProfile()?'login':'register');return}
    showView('dashboard');
    document.querySelector('#account-name').textContent=a.name||'—';
    document.querySelector('#account-email').textContent=a.email||'—';
    document.querySelector('#account-phone').textContent=a.phone||'—';
    verification.textContent=a.emailVerified?t('accountEmailVerified'):t('accountEmailPending');
    verification.className='account-verification '+(a.emailVerified?'verified':'pending');
    const all=getBookings();
    const bookings=all.filter(b=>!b.accountId || b.accountId===a.id);
    const box=document.querySelector('#account-bookings');
    box.innerHTML=bookings.length?bookings.map(formatBooking).join(''):'<div class="account-empty">'+t('accountNoBookings')+'</div>';
    box.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>{
      const booking=all.find(b=>b.id===btn.dataset.edit);if(!booking)return;
      localStorage.setItem('cb-edit-booking',JSON.stringify(booking));window.location.href='./index.html#booking';
    });
    box.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=async()=>{
      const id=btn.dataset.cancel;
      if(!confirm(currentLang==='en'?'Cancel this booking?':'Скасувати це бронювання?'))return;
      const next=all.filter(b=>b.id!==id);saveBookings(next);
      try{await fetch('./api/bookings?id='+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
      dashStatus.textContent=t('accountCancelled');renderDashboard();
    });
  }

  registerForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(registerForm);
    const name=String(fd.get('name')).trim();
    const email=String(fd.get('email')).trim().toLowerCase();
    const phone=String(fd.get('phone')).trim();
    const password=String(fd.get('password'));
    if(!/^\+?[0-9 ()-]{9,20}$/.test(phone)){registerStatus.textContent=t('accountPhoneInvalid');return}
    if(password.length<6){registerStatus.textContent=t('accountPasswordShort');return}
    const passwordHash=await hashPassword(password);
    const profile={id:'CBU-'+Date.now().toString(36).toUpperCase(),name,email,phone,passwordHash,emailVerified:false,createdAt:new Date().toISOString()};
    saveProfile(profile);
    saveSession(profile);
    registerStatus.textContent=t('accountCreating');
    try{
      const response=await fetch('./api/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',name,email,phone})});
      const data=await response.json().catch(()=>({}));
      if(response.ok)registerStatus.textContent=t('accountVerificationSent');
      else registerStatus.textContent=data.error||t('accountLocalSaved');
    }catch(e){registerStatus.textContent=t('accountLocalSaved')}
    renderDashboard();
  });

  loginForm.addEventListener('submit',async e=>{
    e.preventDefault();
    const profile=getProfile();
    const fd=new FormData(loginForm);
    const email=String(fd.get('email')).trim().toLowerCase();
    const passwordHash=await hashPassword(String(fd.get('password')));
    if(!profile || profile.email!==email || profile.passwordHash!==passwordHash){loginStatus.textContent=t('accountLoginError');return}
    saveSession(profile);loginStatus.textContent='';renderDashboard();
  });

  document.querySelector('#show-login').onclick=()=>{loginForm.reset();loginStatus.textContent='';showView('login')};
  document.querySelector('#show-register').onclick=()=>{registerStatus.textContent='';showView('register')};
  document.querySelector('#forgot-password').onclick=()=>{registerStatus.textContent=t('accountForgotText')};
  document.querySelector('#logout').onclick=()=>{localStorage.removeItem(ACCOUNT_KEY);renderDashboard()};

  function handleVerification(){
    const params=new URLSearchParams(location.search);
    if(params.get('verified')!=='1')return;
    const verifiedEmail=(params.get('email')||'').toLowerCase();
    const profile=getProfile();
    if(profile && (!verifiedEmail || profile.email===verifiedEmail)){
      profile.emailVerified=true;saveProfile(profile);
      const session=getSession();if(session){session.emailVerified=true;saveSession(session)}
      history.replaceState({},'',location.pathname);
    }
  }
  handleVerification();
  window.addEventListener('languagechange',renderDashboard);
  renderDashboard();
})();
</script>
</body>
</html>
