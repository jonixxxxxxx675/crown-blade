<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Account</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile-overrides.css">
</head>
<body>
<main class="mobile-page">
<a class="mobile-page-back" href="./index.html">← <span data-i18n="back">Назад</span></a>
<span class="eyebrow" data-i18n="accountEyebrow">ACCOUNT</span>
<h1><span data-i18n="accountTitle">Створити акаунт</span></h1>
<p><span data-i18n="accountText">Зареєструйте акаунт, щоб зберігати свої записи та швидше бронювати наступний візит.</span></p>
<form class="mobile-form" action="#" method="post">
<input type="text" name="name" placeholder="Ім’я" data-i18n-placeholder="namePlaceholder" required>
<input type="email" name="email" placeholder="Email" data-i18n-placeholder="accountEmailPlaceholder" required>
<input type="password" name="password" placeholder="Пароль" data-i18n-placeholder="passwordPlaceholder" minlength="6" required>
<button type="submit"><span data-i18n="register">ЗАРЕЄСТРУВАТИСЯ →</span></button>
</form>
</main>
<script src="./mobile-i18n.js"></script>
</body>
</html>
