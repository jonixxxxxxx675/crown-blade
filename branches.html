<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Наші відділення</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile-overrides.css">
<style>
.branches-page{min-height:100vh;background:#080807;color:#f5eee5}
.branches-wrap{max-width:760px;margin:0 auto;padding:24px 18px 48px}
.branches-back{display:inline-block;color:#d8a96d;text-decoration:none;font-size:12px;letter-spacing:.04em;margin-bottom:30px}
.branches-page .eyebrow{display:block;margin-bottom:8px}
.branches-title{font:500 46px/1 "Cormorant Garamond",serif;margin:0 0 28px}
.branches-list{display:grid;gap:12px}
.branch-card{border:1px solid #ffffff16;border-radius:14px;background:#11110f;padding:20px}
.branch-number{display:block;color:#d8a96d;font-size:10px;letter-spacing:.16em;margin-bottom:9px}
.branch-card h2{font:500 27px/1.05 "Cormorant Garamond",serif;margin:0 0 9px}
.branch-address{margin:0;color:#aaa19a;font-size:13px;line-height:1.6}
@media(min-width:801px){.branches-page{display:none}}
</style>
</head>
<body>
<main class="branches-page">
  <div class="branches-wrap">
    <a class="branches-back" href="./index.html">← Назад</a>
    <span class="eyebrow">ВІДДІЛЕННЯ</span>
    <h1 class="branches-title">Наші відділення</h1>
    <section class="branches-list" aria-label="Наші відділення">
      <article class="branch-card"><span class="branch-number">ВІДДІЛЕННЯ 01</span><h2>Центральне відділення</h2><p class="branch-address">Адреса буде додана</p></article>
      <article class="branch-card"><span class="branch-number">ВІДДІЛЕННЯ 02</span><h2>Південне відділення</h2><p class="branch-address">Адреса буде додана</p></article>
      <article class="branch-card"><span class="branch-number">ВІДДІЛЕННЯ 03</span><h2>Forum Lviv</h2><p class="branch-address">Адреса буде додана</p></article>
    </section>
  </div>
</main>
</body>
</html>
