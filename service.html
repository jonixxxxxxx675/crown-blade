<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crown & Blade — Service</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body class="service-detail-page">
<main class="service-detail" id="service-detail"></main>
<script>
const services=[
 {name:'Classic Haircut',price:'80 грн',image:'service-1.jpg',text:'Класична чоловіча стрижка з підбором форми під риси обличчя. Майстер опрацьовує боки, потилицю та верх, виконує фінальну укладку і надає акуратний завершений вигляд.'},
 {name:'Hair + Beard',price:'130 грн',image:'service-2.jpg',text:'Комплексна процедура для волосся та бороди. Стрижка поєднується з оформленням контурів і довжини бороди, щоб уся форма виглядала цілісно та охайно.'},
 {name:'Beard Trim',price:'60 грн',image:'service-3.jpg',text:'Оформлення бороди з корекцією довжини, контурів і переходів. Майстер підкреслює природну форму та залишає чистий, доглянутий результат.'},
 {name:'Royal Shave',price:'70 грн',image:'service-4.jpg',text:'Класичне королівське гоління з підготовкою шкіри, теплою піною та ретельним проходом бритвою. Завершення процедури — чисті контури та комфортне відчуття шкіри.'},
 {name:'Kids Haircut',price:'60 грн',image:'service-5.jpg',text:'Акуратна стрижка для дітей із підбором зручної форми та довжини. Процедура виконується уважно, щоб результат був охайним і комфортним.'},
 {name:'Skin Fade',price:'90 грн',image:'service-1.jpg',text:'Плавний skin fade з поступовим переходом від шкіри до довжини зверху. Майстер ретельно пропрацьовує контури та переходи для чистого сучасного результату.'}
];
const i=Math.max(0,Math.min(services.length-1,Number(new URLSearchParams(location.search).get('service'))||0));
const s=services[i];
document.title='Crown & Blade — '+s.name;
document.querySelector('#service-detail').innerHTML=`<a class="service-detail-back" href="./index.html#services">← Повернутися до послуг</a><img class="service-detail-photo" src="./assets/${s.image}" alt="${s.name}"><span class="eyebrow">SERVICE</span><h1>${s.name}</h1><div class="service-detail-price">${s.price}</div><p>${s.text}</p><a class="service-detail-book" href="./index.html#booking">ЗАПИСАТИСЯ →</a>`;
</script>
</body>
</html>
